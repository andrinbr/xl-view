# SonarQube project specific settings
# Define the root directory for sources and tests
sonar.sources=.
sonar.tests=.

# Code coverage report paths (will be generated by the CI)
# Run manually with:
# cargo llvm-cov --workspace --all-features --all-targets \
#     --lcov --output-path lcov.info -- \
#     --include-ignored --test-threads=1
sonar.rust.lcov.reportPaths=lcov.info

# Test file inclusions (this excludes all other files by design)
sonar.test.inclusions=tests/**/*.rs,**/tests.rs

# Avoid generating duplication data that Sonar ignores for tests anyway
# This gets rid of a duplication warning in the scanner
sonar.cpd.exclusions=tests/**/*.rs,**/tests.rs

# Files excluded from analysis
sonar.exclusions=tests/fixtures/**,assets/**,docs/**,scripts/generate-decode-fixtures.sh
