accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
]

targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = false }

[xl-view]
accepted = ["GPL-3.0-only"]

[vulkan-hdr-metadata]
accepted = ["GPL-3.0-only"]

# Workaround to get a more deterministic output from cargo-about
# https://github.com/EmbarkStudios/cargo-about/issues/202 
[rfd.clarify]
# rfd contains a second LICENSE for vendored window_identifier code.
# Pin both files because cargo-about's recursive scan can otherwise select
# either MIT text depending on traversal order.
license = "MIT"

[[rfd.clarify.files]]
path = "LICENSE"
checksum = "65fc947f4bac882a2cd104ef73c246b1b037059df9f2b3a58b7f77f0b9e56071"

[[rfd.clarify.files]]
path = "src/backend/xdg_desktop_portal/window_identifier/LICENSE"
