[package]
name = "xl-view"
version = "0.4.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A minimalist HDR image viewer optimized for large images"
repository.workspace = true
publish = false

[package.metadata.winresource]
ProductName = "XL-View"
FileDescription = "XL-View"
OriginalFilename = "xl-view.exe"
LegalCopyright = "Copyright 2026 Andrin Brunner and contributors"

[workspace]
members = ["crates/vulkan-hdr-metadata", "crates/winit-macos-open"]
resolver = "3"

[workspace.package]
authors = ["Andrin Brunner"]
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/andrinbr/xl-view"

[dependencies]
bytemuck = "1.25"
clap = { version = "4.5", features = ["derive"] }
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
half = "2.7.1"
jxl = { version = "=0.8.0", features = ["brotli"] }
kamadak-exif = "0.6.1"
moxcms = { version = "=0.9.1", features = ["extended_range"] }
pollster = "0.4.0"
rayon = "1.12"
resvg = { version = "0.48.1", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = [
    "wayland",
    "xdg-portal",
] }
roxmltree = "0.21.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# winit 0.31 is still in beta. Keep winit and the direct winit-* dependencies below
# pinned to the same exact pre-release.
winit = { version = "=0.31.0-beta.3", default-features = false, features = [
    "wayland",
    "wayland-csd-adwaita",
    "wayland-dlopen",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = [
    "parking_lot",
    "std",
    "vulkan",
    "wgsl",
] }

# wgpu identifies the surface as PQ/BT.2020 but cannot declare its luminance range.
# Without this bridge, Wayland compositors may assume a 10,000-nit source and tone-map
# XL-View's already display-mapped output a second time, making the image too dark.
vulkan-hdr-metadata = { path = "crates/vulkan-hdr-metadata" }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "0.0.29", features = ["kernel"] }
wgpu = { version = "30.0.0", default-features = false, features = [
    "dx12",
    "parking_lot",
    "std",
    "vulkan",
    "wgsl",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSNotification",
    "NSOperation",
    "NSString",
    "NSURL",
    "block2",
    "std",
] }
winit-common = { version = "=0.31.0-beta.3", features = [
    "foundation",
] }
winit-macos-open = { path = "crates/winit-macos-open" }
wgpu = { version = "30.0.0", default-features = false, features = [
    "metal",
    "parking_lot",
    "std",
    "wgsl",
] }
# 30.0.1 crashes when configuring Metal PQ output. Pin until a fixed 30.x
# is released. Cargo.lock shares this backend version across all OSes:
# https://github.com/gfx-rs/wgpu/pull/10175
wgpu-hal = { version = "=30.0.0", default-features = false }

# Keep this unconditional: Cargo cannot gate a build dependency on the
# application's target OS, so build.rs must decide whether to use it.
[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
