[package]
name = "xl-view"
version = "0.5.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A minimalist HDR image viewer optimized for large images"
repository.workspace = true
publish = false

[package.metadata.winresource]
ProductName = "XL-View"
FileDescription = "XL-View"
OriginalFilename = "xl-view.exe"
LegalCopyright = "Copyright 2026 Andrin Brunner and contributors"

[workspace]
members = ["crates/vulkan-hdr-metadata", "crates/winit-macos-open"]
resolver = "3"

[workspace.package]
authors = ["Andrin Brunner"]
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/andrinbr/xl-view"

[dependencies]
# Already part of jxl's "brotli" feature. Used directly to decompress gain map
# boxes within a byte limit.
brotli-decompressor = "6.3.1"
bytemuck = "1.25.2"
clap = { version = "4.6.7", features = ["derive"] }
fontdue = { version = "0.9.5", default-features = false, features = ["std"] }
half = "2.7.1"
jxl = { version = "=0.8.0", features = ["brotli"] }
kamadak-exif = "0.6.2"
moxcms = { version = "=0.9.2", features = ["extended_range"] }
pollster = "1.0.1"
quick-xml = "0.42.0"
rayon = "1.12.0"
resvg = { version = "0.50.0", default-features = false }
rfd = { version = "0.18.0", default-features = false, features = [
    "wayland",
    "xdg-portal",
] }
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Converts the `file:` URIs of dropped files to paths.
url = "2.5.8"
# winit 0.31 is still in beta. Keep winit and the direct winit-* dependencies below
# pinned to the same exact pre-release.
winit = { version = "=0.31.0-beta.4", default-features = false, features = [
    "wayland",
    "wayland-csd-adwaita",
    "wayland-dlopen",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = [
    "parking_lot",
    "std",
    "vulkan",
    "wgsl",
] }

# wgpu identifies the surface as PQ/BT.2020 but cannot declare its luminance range.
# Without this bridge, Wayland compositors may assume a 10,000-nit source and tone-map
# XL-View's already display-mapped output a second time, making the image too dark.
vulkan-hdr-metadata = { path = "crates/vulkan-hdr-metadata" }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "0.0.29", features = ["kernel"] }
wgpu = { version = "30.0.2", default-features = false, features = [
    "dx12",
    "parking_lot",
    "std",
    "vulkan",
    "wgsl",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSNotification",
    "NSOperation",
    "NSString",
    "block2",
] }
winit-common = { version = "=0.31.0-beta.4", features = [
    "foundation",
] }
winit-macos-open = { path = "crates/winit-macos-open" }
wgpu = { version = "30.0.2", default-features = false, features = [
    "metal",
    "parking_lot",
    "std",
    "wgsl",
] }

# Keep this unconditional: Cargo cannot gate a build dependency on the
# application's target OS, so build.rs must decide whether to use it.
[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
naga = { version = "30.0.2", features = ["wgsl-in"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
