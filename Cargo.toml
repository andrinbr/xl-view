[package]
name = "xl-view"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A minimalist HDR image viewer optimized for large images"
homepage = "https://github.com/andrinbr/xl-view"
repository.workspace = true
publish = false
default-run = "xl-view"

[package.metadata.packager]
product-name = "XL-View"
identifier = "io.github.andrinbr.xl_view"
category = "GraphicsAndDesign"
copyright = "Copyright 2026 Andrin Brunner and contributors"
license-file = "LICENSE"
icons = ["assets/icons/io.github.andrinbr.xl_view.png"]
# cargo-packager names the Linux desktop file after the main binary (stripping any extension suffixes).
# This alias gives it the correct application ID while the desktop entry launches xl-view.
binaries = [
    { path = "io.github.andrinbr.xl_view.bin", main = true },
    { path = "xl-view" },
]
file-associations = [
    { extensions = ["jxl"], mime-type = "image/jxl", name = "JPEG XL image", role = "viewer" },
]

[package.metadata.packager.deb]
desktop-template = "packaging/linux/io.github.andrinbr.xl_view.desktop"

[package.metadata.packager.appimage.files]
"packaging/linux/io.github.andrinbr.xl_view.appdata.xml" = "usr/share/metainfo/io.github.andrinbr.xl_view.appdata.xml"
"assets/icons/io.github.andrinbr.xl_view.svg" = "usr/share/icons/hicolor/scalable/apps/io.github.andrinbr.xl_view.svg"
"COPYRIGHT" = "usr/share/licenses/xl-view/COPYRIGHT"
"LICENSE" = "usr/share/licenses/xl-view/LICENSE"
"docs/legal/THIRD-PARTY-LICENSES.html" = "usr/share/licenses/xl-view/THIRD-PARTY-LICENSES.html"
"assets/fonts/AdwaitaSans-LICENSE.txt" = "usr/share/licenses/xl-view/AdwaitaSans-LICENSE.txt"

[workspace]
members = ["crates/vulkan-hdr-metadata"]
default-members = ["."]
resolver = "3"

[workspace.package]
authors = ["Andrin Brunner"]
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/andrinbr/xl-view"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
half = "2.7.1"
jxl-grid = "0.6.2"
jxl-oxide = { version = "0.12.6", default-features = false, features = [
    "moxcms",
    "rayon",
] }
kamadak-exif = "0.6.1"
moxcms = "0.8.1"
pollster = "0.4.0"
rayon = "1.12"
resvg = { version = "0.47.0", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = [
    "wayland",
    "xdg-portal",
] }
roxmltree = "0.21.1"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Temporary until a winit release includes the new drag-and-drop API: https://github.com/rust-windowing/winit/pull/4571
# Keep upstream master pinned to an exact revision and switch back to a crates.io winit release once the API is released.
winit = { git = "https://github.com/rust-windowing/winit", rev = "42366231b0d92480a933339bd5eaa7fba8106f42", default-features = false, features = [
    "wayland",
    "wayland-csd-adwaita",
    "wayland-dlopen",
] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
vulkan-hdr-metadata = { path = "crates/vulkan-hdr-metadata" }
wgpu = { version = "30.0.0", default-features = false, features = [
    "parking_lot",
    "std",
    "vulkan",
    "wgsl",
] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = [
    "metal",
    "parking_lot",
    "std",
    "wgsl",
] }

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
